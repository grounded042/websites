{% extends "base.html" %}

{% import "macros.html" as macros %}

{% block content %}
<article class="post">
	<header>
		<h1>{{ page.title }}</h1>
		<h5>{{ macros::post_meta(page=page, full=true) }} | {{ page.reading_time }} min read</h5>
	</header>
	<section>
		{{ page.content | safe }}
	</section>
</article>
{% endblock content %}
